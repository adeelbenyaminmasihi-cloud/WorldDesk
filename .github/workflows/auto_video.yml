name: Video Employee Bot

on:
  workflow_dispatch:
  schedule:
    # Din mein 5 baar automatically video generate aur upload karne ka schedule
    - cron: '0 3,7,11,15,19 * * *'

permissions:
  contents: write

concurrency:
  group: video-employee-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-dejavu-core
          fc-cache -f

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir edge-tts requests pillow

      - name: Run Video Generator Employee
        run: python -u main.py

      - name: Save Used Topics Memory
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add used_topics.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'Remember used video topic [skip ci]'
            git push || true
          else
            echo 'No used-topics changes to save.'
          fi

      - name: Upload generated video backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-reel-${{ github.run_number }}
          path: |
            final_reel.mp4
          if-no-files-found: warn
          retention-days: 7
